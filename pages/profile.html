<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../assets/images/favicon-32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="../assets/images/favicon-16.png" sizes="16x16" />
  <link rel="icon" type="image/png" href="../assets/images/favicon-48.png" sizes="48x48" />
  <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png" />
  <!-- Theme: applied synchronously BEFORE the stylesheets so first paint is already
       the saved Day/Night theme (no flash). Student pages only. -->
  <script src="../assets/js/theme-init.js"></script>
  <title>Profile — The Knight Club</title>
  <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="../assets/fonts/coolvetica.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600&family=Cormorant+Garamond:ital,wght@1,300;1,400;1,500&family=Poppins:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <link rel="stylesheet" href="../assets/css/site.css" />
  <link rel="stylesheet" href="../assets/css/orders.css" />
  <link rel="stylesheet" href="../assets/css/student.css" />
  <link rel="stylesheet" href="../assets/css/student-theme.css" />
  <link rel="stylesheet" href="../assets/css/buttons.css" />
  <style>html.auth-pending body { visibility: hidden; }</style>
  <script>document.documentElement.classList.add('auth-pending');</script>
</head>
<body class="student-page">

  <div id="student-header"></div>

  <main class="student-main" id="main">
    <div class="student-container is-narrow">

      <a href="dashboard.html" class="back-link"><span aria-hidden="true">&larr;</span> Back to Dashboard</a>

      <header class="profile-header profile-header--editable" aria-labelledby="profile-name">
        <div class="photo-preview-wrap photo-preview-wrap--hero" id="photo-row">
          <span class="avatar avatar-lg" id="photo-preview" aria-hidden="true"></span>
          <span class="photo-progress-ring" aria-hidden="true"></span>
          <button type="button" class="photo-edit-btn" id="photo-choose-btn" aria-label="Change profile photo">
            <svg viewBox="0 0 20 20" width="15" height="15" fill="none" aria-hidden="true"><path d="M13.5 2.5l4 4L7 17H3v-4L13.5 2.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" /></svg>
          </button>
          <input type="file" class="photo-input" id="photo-input" accept="image/jpeg,image/jpg,image/png,image/webp" aria-label="Choose a profile photo" />
        </div>
        <div class="profile-header-info">
          <h1 class="profile-name" id="profile-name"></h1>
          <div class="profile-sub">
            <span id="profile-userid"></span>
            <span class="badge" id="profile-role"></span>
            <span class="badge badge--verified" id="profile-verified" hidden>Verified</span>
          </div>
          <div class="profile-header-actions">
            <button type="button" class="btn btn-outline btn-sm" id="photo-remove-btn" hidden>
              <span class="label">Remove photo</span>
            </button>
          </div>
        </div>
      </header>

      <div id="photo-alert" class="alert" role="alert" hidden></div>

      <section class="s-card" aria-labelledby="profile-info-title">
        <h2 class="s-card-title" id="profile-info-title">Personal information</h2>
        <p class="s-card-desc">The details on your Knight Club account. JPEG, PNG or WebP photos up to 10&nbsp;MB.</p>
        <dl class="kv kv--grid" id="profile-list"></dl>
      </section>

      <p style="margin-top:var(--space-6)" class="text-muted">
        Want to change your password? Head to <a href="settings.html">Account Settings</a>.
      </p>

    </div>
  </main>

  <div id="student-footer"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/theme-toggle.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/student-shell.js"></script>
  <script src="../assets/js/student-ui.js"></script>
  <script src="../assets/js/profile.js"></script>
</body>
</html>
