<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../assets/images/favicon-32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="../assets/images/favicon-16.png" sizes="16x16" />
  <link rel="icon" type="image/png" href="../assets/images/favicon-48.png" sizes="48x48" />
  <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png" />
  <title>Set a new password — The Knight Club</title>
  <meta name="description" content="Set a new password for your The Knight Club account." />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="../assets/fonts/coolvetica.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600&family=Poppins:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <link rel="stylesheet" href="../assets/css/buttons.css" />
</head>
<body class="auth-page auth-page--split">

  <main class="auth-main">
    <div class="auth-scene" id="auth-scene" data-active="reset">

      <a href="../index.html" class="auth-logo" aria-label="The Knight Club — home">
        <img class="auth-logo-mark" src="../assets/images/knight-emblem-512.png" width="48" height="48" alt="" aria-hidden="true" />
        <span class="auth-logo-text">The <span>Knight Club</span></span>
      </a>

      <div class="auth-card" id="auth-card">
        <section class="auth-face" id="auth-face-reset" aria-labelledby="reset-title">
          <h1 id="reset-title">Set a new password</h1>
          <p class="lead">Choose a new password for your account.</p>

          <div id="form-alert-reset" class="alert" role="alert" hidden></div>

          <form id="reset-password-form" novalidate autocomplete="on">
            <div class="form-grid">

              <div class="field">
                <label for="rp-newPassword">New password</label>
                <div class="password-wrap">
                  <input class="input" id="rp-newPassword" name="newPassword" type="password"
                         autocomplete="new-password" maxlength="128" required aria-describedby="rp-newPassword-error" />
                  <button type="button" class="toggle-password" aria-pressed="false" aria-label="Show or hide password">Show</button>
                </div>
                <p class="field-error" id="rp-newPassword-error" aria-live="polite"></p>
              </div>

              <div class="field">
                <label for="rp-confirmNewPassword">Confirm new password</label>
                <div class="password-wrap">
                  <input class="input" id="rp-confirmNewPassword" name="confirmNewPassword" type="password"
                         autocomplete="new-password" maxlength="128" required aria-describedby="rp-confirmNewPassword-error" />
                  <button type="button" class="toggle-password" aria-pressed="false" aria-label="Show or hide confirmation">Show</button>
                </div>
                <p class="field-error" id="rp-confirmNewPassword-error" aria-live="polite"></p>
              </div>

              <p class="hint" style="margin-top: -4px;">Password: at least 8 characters.</p>

              <div class="field">
                <button class="btn btn-primary btn-block" id="reset-submit-btn" type="submit">
                  <span class="spinner" aria-hidden="true"></span>
                  <span class="label">Reset password</span>
                </button>
              </div>
            </div>
          </form>

          <p class="auth-alt"><a href="login.html">Back to sign in</a></p>
        </section>
      </div>
    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/reset-password.js"></script>
</body>
</html>
