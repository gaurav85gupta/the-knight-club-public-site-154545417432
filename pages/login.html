<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../assets/images/favicon-32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="../assets/images/favicon-16.png" sizes="16x16" />
  <link rel="icon" type="image/png" href="../assets/images/favicon-48.png" sizes="48x48" />
  <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png" />
  <title>Sign in — The Knight Club</title>
  <meta name="description" content="Sign in to your The Knight Club student account." />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="../assets/fonts/coolvetica.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600&family=Cormorant+Garamond:ital,wght@1,300;1,400;1,500&family=Poppins:wght@300;400;500;600;700;800&display=swap" />
  <link rel="preload" as="image" href="../assets/images/auth-background.jpg" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <link rel="stylesheet" href="../assets/css/buttons.css" />
</head>
<body class="auth-page auth-page--split">

  <main class="auth-main">
    <div class="auth-scene" id="auth-scene" data-active="login">

      <a href="../index.html" class="auth-logo" aria-label="The Knight Club — home">
        <img class="auth-logo-mark" src="../assets/images/knight-emblem-512.png" width="48" height="48" alt="" aria-hidden="true" />
        <span class="auth-logo-text">The <span>Knight Club</span></span>
      </a>

      <div class="auth-card" id="auth-card">

        <section class="auth-face" id="auth-face-login" aria-labelledby="login-title">
          <h1 id="login-title">Welcome back</h1>
          <p class="lead">Sign in to continue learning.</p>

          <div id="form-alert" class="alert" role="alert" hidden></div>

          <div id="google-login-btn" style="display:flex; justify-content:center;"></div>
          <div class="auth-divider">or sign in with email</div>

          <!-- Email + password sign-in (default) -->
          <form id="login-form" novalidate autocomplete="on">
            <div class="form-grid">

              <div class="field">
                <label for="email">Email address</label>
                <input class="input" id="email" name="email" type="email" inputmode="email"
                       autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false"
                       maxlength="254" placeholder="you@example.com" required aria-describedby="email-error" />
                <p class="field-error" id="email-error" aria-live="polite"></p>
              </div>

              <div class="field">
                <div class="field-label-row" style="display:flex; justify-content:space-between; align-items:baseline;">
                  <label for="password">Password</label>
                  <a href="forgot-password.html" class="hint" style="margin:0;">Forgot password?</a>
                </div>
                <div class="password-wrap">
                  <input class="input" id="password" name="password" type="password"
                         autocomplete="current-password" maxlength="128" required
                         aria-describedby="password-error" />
                  <button type="button" class="toggle-password" aria-pressed="false" aria-label="Show or hide password">Show</button>
                </div>
                <p class="field-error" id="password-error" aria-live="polite"></p>
              </div>

              <div class="field">
                <button class="btn btn-primary btn-block" id="submit-btn" type="submit">
                  <span class="spinner" aria-hidden="true"></span>
                  <span class="label">Sign in</span>
                </button>
              </div>
            </div>
          </form>

          <p class="auth-method-toggle">
            <button type="button" id="toggle-legacy-login">Sign in with User ID instead</button>
          </p>

          <!-- Legacy User-ID sign-in, collapsed by default. Unchanged logic
               from the original single-page login — only presentation moved. -->
          <form id="legacy-login-form" class="auth-legacy-form" novalidate autocomplete="on" hidden>
            <div class="form-grid">

              <div class="field">
                <label for="userId">User ID</label>
                <input class="input" id="userId" name="userId" type="text" inputmode="text"
                       autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"
                       maxlength="100" aria-describedby="userId-error" />
                <p class="field-error" id="userId-error" aria-live="polite"></p>
              </div>

              <div class="field">
                <label for="legacy-password">Password</label>
                <div class="password-wrap">
                  <input class="input" id="legacy-password" name="password" type="password"
                         autocomplete="current-password" maxlength="128"
                         aria-describedby="legacy-password-error" />
                  <button type="button" class="toggle-password" aria-pressed="false" aria-label="Show or hide password">Show</button>
                </div>
                <p class="field-error" id="legacy-password-error" aria-live="polite"></p>
              </div>

              <div class="field">
                <button class="btn btn-primary btn-block" id="legacy-submit-btn" type="submit">
                  <span class="spinner" aria-hidden="true"></span>
                  <span class="label">Sign in</span>
                </button>
              </div>
            </div>
          </form>
          <p class="auth-method-toggle auth-legacy-form" id="toggle-email-wrap" hidden>
            <button type="button" id="toggle-email-login">Use email instead</button>
          </p>

          <p class="auth-alt">New here? <a href="signup.html">Create an account</a></p>
        </section>

      </div>
    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/google-signin.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
