<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../assets/images/favicon-32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="../assets/images/favicon-16.png" sizes="16x16" />
  <link rel="icon" type="image/png" href="../assets/images/favicon-48.png" sizes="48x48" />
  <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png" />
  <title>Sign in — The Knight Club</title>
  <meta name="description" content="Sign in to your The Knight Club student account." />
  <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="../assets/fonts/coolvetica.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600&family=Cormorant+Garamond:ital,wght@1,300;1,400;1,500&family=Poppins:wght@300;400;500;600;700;800&display=swap" />
  <link rel="preload" as="image" href="../assets/images/auth-background.jpg" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <link rel="stylesheet" href="../assets/css/buttons.css" />
</head>
<body class="auth-page auth-page--split">

  <main class="auth-main">
    <div class="auth-scene" id="auth-scene" data-active="login">

      <a href="../index.html" class="auth-logo" aria-label="The Knight Club — home">
        <img class="auth-logo-mark" src="../assets/images/knight-emblem-512.png" width="48" height="48" alt="" aria-hidden="true" />
        <span class="auth-logo-text">The <span>Knight Club</span></span>
      </a>

      <div class="auth-switch" role="tablist" aria-label="Choose Sign in or Create account">
        <button type="button" id="switch-login" role="tab" aria-selected="true" aria-controls="auth-face-login">Sign In</button>
        <button type="button" id="switch-signup" role="tab" aria-selected="false" aria-controls="auth-face-signup">Create Account</button>
      </div>

      <div class="auth-card" id="auth-card">

        <!-- Sign In -->
        <section class="auth-face" id="auth-face-login" aria-labelledby="login-title">
          <h1 id="login-title">Welcome back</h1>
          <p class="lead">Sign in with your User ID and password.</p>

          <div id="form-alert" class="alert" role="alert" hidden></div>

          <form id="login-form" novalidate autocomplete="on">
            <div class="form-grid">

              <div class="field">
                <label for="userId">User ID</label>
                <input class="input" id="userId" name="userId" type="text" inputmode="text"
                       autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"
                       maxlength="100" required aria-describedby="userId-error" />
                <p class="field-error" id="userId-error" aria-live="polite"></p>
              </div>

              <div class="field">
                <label for="password">Password</label>
                <div class="password-wrap">
                  <input class="input" id="password" name="password" type="password"
                         autocomplete="current-password" maxlength="128" required
                         aria-describedby="password-error" />
                  <button type="button" class="toggle-password" aria-pressed="false" aria-label="Show or hide password">Show</button>
                </div>
                <p class="field-error" id="password-error" aria-live="polite"></p>
              </div>

              <div class="field">
                <button class="btn btn-primary btn-block" id="submit-btn" type="submit">
                  <span class="spinner" aria-hidden="true"></span>
                  <span class="label">Sign in</span>
                </button>
              </div>
            </div>
          </form>

          <p class="auth-alt">New here? <a href="signup.html" data-auth-switch="signup">Create an account</a></p>
        </section>

        <!-- Create Account -->
        <section class="auth-face" id="auth-face-signup" aria-labelledby="signup-title" aria-hidden="true" hidden>
          <h1 id="signup-title">Create your account</h1>
          <p class="lead">Join The Knight Club and start learning today.</p>

          <div id="form-alert-signup" class="alert" role="alert" hidden></div>

          <form id="signup-form" novalidate autocomplete="on">
            <div class="form-grid">

              <div class="field field-full">
                <label for="su-userId">User ID</label>
                <input class="input" id="su-userId" name="userId" type="text" inputmode="text"
                       autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"
                       maxlength="40" placeholder="e.g. student_01" required aria-describedby="su-userId-hint su-userId-error" />
                <p class="hint" id="su-userId-hint">4-20 characters: letters, numbers, underscore.</p>
                <p class="field-error" id="su-userId-error" aria-live="polite"></p>
              </div>

              <div class="field">
                <label for="su-fullName">Full name</label>
                <input class="input" id="su-fullName" name="fullName" type="text" autocomplete="name"
                       maxlength="80" placeholder="Your full name" required aria-describedby="su-fullName-error" />
                <p class="field-error" id="su-fullName-error" aria-live="polite"></p>
              </div>

              <div class="field">
                <label for="su-mobile">Mobile number</label>
                <input class="input" id="su-mobile" name="mobile" type="tel" inputmode="numeric"
                       autocomplete="tel-national" maxlength="20" placeholder="98765 43210" required
                       aria-describedby="su-mobile-error" />
                <p class="field-error" id="su-mobile-error" aria-live="polite"></p>
              </div>

              <div class="field field-full">
                <label for="su-state">State</label>
                <input class="input" id="su-state" name="state" type="text" autocomplete="address-level1"
                       maxlength="60" required aria-describedby="su-state-error" />
                <p class="field-error" id="su-state-error" aria-live="polite"></p>
              </div>

              <div class="field">
                <label for="su-password">Password</label>
                <div class="password-wrap">
                  <input class="input" id="su-password" name="password" type="password"
                         autocomplete="new-password" maxlength="128" required
                         aria-describedby="su-password-error" />
                  <button type="button" class="toggle-password" aria-pressed="false" aria-label="Show or hide password">Show</button>
                </div>
                <p class="field-error" id="su-password-error" aria-live="polite"></p>
              </div>

              <div class="field">
                <label for="su-confirmPassword">Confirm password</label>
                <div class="password-wrap">
                  <input class="input" id="su-confirmPassword" name="confirmPassword" type="password"
                         autocomplete="new-password" maxlength="128" required aria-describedby="su-confirmPassword-error" />
                  <button type="button" class="toggle-password" aria-pressed="false" aria-label="Show or hide confirmation">Show</button>
                </div>
                <p class="field-error" id="su-confirmPassword-error" aria-live="polite"></p>
              </div>

              <p class="hint" style="grid-column: 1 / -1; margin-top: -4px;">Password: at least 8 characters.</p>

              <div class="field field-full">
                <button class="btn btn-primary btn-block" id="signup-submit-btn" type="submit">
                  <span class="spinner" aria-hidden="true"></span>
                  <span class="label">Create account</span>
                </button>
              </div>
            </div>
          </form>

          <p class="auth-alt">Already have an account? <a href="login.html" data-auth-switch="login">Sign in</a></p>
        </section>

      </div>
    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/auth-tabs.js"></script>
  <script src="../assets/js/login.js"></script>
  <script src="../assets/js/signup.js"></script>
</body>
</html>
