<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../assets/images/favicon-32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="../assets/images/favicon-16.png" sizes="16x16" />
  <link rel="icon" type="image/png" href="../assets/images/favicon-48.png" sizes="48x48" />
  <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png" />
  <title>Verify your email — The Knight Club</title>
  <meta name="description" content="Verify your The Knight Club account email address." />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="../assets/fonts/coolvetica.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600&family=Poppins:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <link rel="stylesheet" href="../assets/css/buttons.css" />
</head>
<body class="auth-page auth-page--split">

  <main class="auth-main">
    <div class="auth-scene" id="auth-scene" data-active="verify">

      <a href="../index.html" class="auth-logo" aria-label="The Knight Club — home">
        <img class="auth-logo-mark" src="../assets/images/knight-emblem-512.png" width="48" height="48" alt="" aria-hidden="true" />
        <span class="auth-logo-text">The <span>Knight Club</span></span>
      </a>

      <div class="auth-card" id="auth-card">
        <section class="auth-face" id="auth-face-verify" aria-live="polite">

          <!-- Replaced entirely by verify-email.js once the result is known. -->
          <div class="auth-status">
            <div class="auth-status-icon auth-status-icon--pending" aria-hidden="true">&#8230;</div>
            <h1>Verifying your email…</h1>
            <p class="lead">Please wait a moment.</p>
          </div>

        </section>
      </div>
    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/verify-email.js"></script>
</body>
</html>
