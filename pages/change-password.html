<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
  <link rel="icon" type="image/png" href="../assets/images/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png" />
  <!-- Theme: applied synchronously BEFORE the stylesheets so first paint is already
       the saved Day/Night theme (no flash). Student pages only. -->
  <script src="../assets/js/theme-init.js"></script>
  <title>Change Password — The Knight Club</title>
  <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="../assets/fonts/coolvetica.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400;1,500&family=Poppins:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <link rel="stylesheet" href="../assets/css/site.css" />
  <link rel="stylesheet" href="../assets/css/orders.css" />
  <link rel="stylesheet" href="../assets/css/student.css" />
  <link rel="stylesheet" href="../assets/css/student-theme.css" />
  <link rel="stylesheet" href="../assets/css/buttons.css" />
  <style>html.auth-pending body { visibility: hidden; }</style>
  <script>document.documentElement.classList.add('auth-pending');</script>
</head>
<body class="student-page">

  <div id="student-header"></div>

  <main class="student-main" id="main">
    <div class="student-container is-narrow">

      <a href="settings.html" class="back-link"><span aria-hidden="true">&larr;</span> Back to Settings</a>

      <header class="page-head">
        <div>
          <p class="eyebrow">Security</p>
          <h1 class="page-title">Change Password</h1>
          <p class="page-sub">Other devices will be signed out. This one stays signed in.</p>
        </div>
      </header>

      <section class="s-card" aria-labelledby="pw-title">
        <h2 class="sr-only" id="pw-title">Change password form</h2>

        <div id="pw-alert" class="alert" role="alert" hidden></div>

        <form id="pw-form" class="student-form" novalidate>
          <div class="form-grid">
            <div class="field">
              <label for="currentPassword">Current password</label>
              <div class="password-wrap">
                <input class="input" id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" maxlength="128" required aria-describedby="currentPassword-error" />
                <button type="button" class="toggle-password" aria-pressed="false" aria-label="Show or hide password">Show</button>
              </div>
              <p class="field-error" id="currentPassword-error" aria-live="polite"></p>
            </div>
            <div class="field">
              <label for="newPassword">New password</label>
              <div class="password-wrap">
                <input class="input" id="newPassword" name="newPassword" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="newPassword-hint newPassword-error" />
                <button type="button" class="toggle-password" aria-pressed="false" aria-label="Show or hide password">Show</button>
              </div>
              <p class="hint" id="newPassword-hint">At least 8 characters.</p>
              <p class="field-error" id="newPassword-error" aria-live="polite"></p>
            </div>
            <div class="field">
              <label for="confirmNewPassword">Confirm new password</label>
              <div class="password-wrap">
                <input class="input" id="confirmNewPassword" name="confirmNewPassword" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="confirmNewPassword-error" />
                <button type="button" class="toggle-password" aria-pressed="false" aria-label="Show or hide password">Show</button>
              </div>
              <p class="field-error" id="confirmNewPassword-error" aria-live="polite"></p>
            </div>
            <div class="field">
              <button class="btn btn-primary btn-lg" id="pw-submit" type="submit">
                <span class="spinner" aria-hidden="true"></span>
                <span class="label">Update Password</span>
              </button>
            </div>
          </div>
        </form>
      </section>

    </div>
  </main>

  <div id="student-footer"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/theme-toggle.js"></script>
  <script src="../assets/js/student-shell.js"></script>
  <script src="../assets/js/student-ui.js"></script>
  <script src="../assets/js/change-password.js"></script>
</body>
</html>
